# docker-java configuration: do NOT pin api.version. testcontainers-bom:1.20.6
# pulls in docker-java 3.4.1, which auto-negotiates the API with the daemon on
# first contact. The previous hardcoded `api.version=1.54` broke the GitHub
# hosted ubuntu-latest runner (Docker engine max API = 1.48,
# "client version 1.54 is too new") and made every Testcontainers test fail
# with "Previous attempts to find a Docker environment failed." Leaving the
# line unset lets docker-java pick the highest mutually-supported version.
