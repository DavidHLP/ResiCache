# Testcontainers Configuration
#
# Container reuse is disabled to ensure each test run uses fresh containers.
# This provides better test isolation and reproducibility.

# Disable container reuse - each test run uses fresh containers
# (Default is false, but we explicitly set it for clarity)
testcontainers.reuse.enable=false

# Docker API version: do NOT pin DOCKER_API_VERSION. testcontainers-bom:1.20.4
# pulls in docker-java 3.4.0, which auto-negotiates the API with the daemon on
# first contact. Pinning to 1.54 here broke the GitHub-hosted ubuntu-latest
# runner (Docker engine max API = 1.48, "client version 1.54 is too new") and
# made every Testcontainers test fail with
# "Previous attempts to find a Docker environment failed." Let auto-negotiation
# handle the version; it works on both the GitHub runner and local WSL2.