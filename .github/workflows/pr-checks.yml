name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]

env:
  JAVA_VERSION: '21'

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: ./.github/actions/setup-jdk-21

      - name: Install socat for integration tests
        # AbstractRedisIntegrationTest shells out to `socat` to forward the
        # testcontainers container bridge IP back to 127.0.0.1, which the
        # Spring context connects to. The Ubuntu runner does not ship socat
        # by default. Without it every @Testcontainers IT throws
        # "Cannot start socat for container …" before Spring can start.
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends socat

      - name: Run All Checks
        run: ./mvnw clean verify checkstyle:check -B
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Check Dependency Converge
        run: ./mvnw dependency:analyze -B
        continue-on-error: true

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.3
        with:
          cache-dir: .qodana/cache
        continue-on-error: true

      - name: Add PR Comment on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ PR quality checks failed. Please review the logs and fix any issues before merging.'
            })
