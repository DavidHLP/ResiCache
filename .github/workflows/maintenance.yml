name: Weekly Verification and Security
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verification
    uses: ./.github/workflows/_verify.yml
  codeql:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-jdk-21
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - run: ./mvnw -DskipTests package -B
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_quality.yml
    with:
      qodana-enabled: ${{ vars.QODANA_ENABLED == 'true' }}
    secrets:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
