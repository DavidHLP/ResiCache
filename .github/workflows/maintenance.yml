name: Weekly Verification and Security
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verification
    uses: ./.github/workflows/_verify.yml
  codeql:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_codeql.yml
    with:
      upload: always
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_quality.yml
    with:
      qodana-enabled: ${{ vars.QODANA_ENABLED == 'true' }}
    secrets:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
