name: Reusable CodeQL
on:
  workflow_call:
    inputs:
      upload:
        description: SARIF upload policy; PR callers keep the read-only default.
        type: string
        default: never
# Permissions come from the caller: PRs are read-only, maintenance can upload.
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-jdk-21
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
      - run: ./mvnw -DskipTests package -B
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          upload: ${{ inputs.upload }}
