name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1024m -XX:+UseParallelGC'

jobs:
  # =========================================================================
  # Stage 1: Fast Feedback Quality & Guardrails (Parallel)
  # =========================================================================
  checkstyle:
    name: "1.1 Quality · Checkstyle"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: ./.github/actions/setup-jdk-21

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check -B

  docs-consistency:
    name: "1.2 Guard · Docs Consistency"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard against removed-feature regressions in docs
        run: |
          set -e
          # 1. 黑名单:被移除的过度工程符号不应再出现在对外 README 中
          banned="CircuitBreakerCacheWrapper RateLimiterCacheWrapper \
                  SpelConditionEvaluator CacheEvictedEvent CacheMetricsRecorder \
                  BloomFilterProvider LockProvider RedissonLockProvider"
          for sym in $banned; do
            hits=$(grep -rnF "\`$sym\`" README.md README.zh-CN.md 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "::error::Removed symbol '$sym' is still referenced as a code identifier in README:"
              echo "$hits"
              exit 1
            fi
          done
          echo "OK: No removed-symbol regressions (as code identifiers) in README."

          # 2. 白名单:README 宣称的关键类必须在 src 存在
          for cls in RedisCacheAutoConfiguration RedisProCacheProperties RedisProCache \
                     RedisProCacheManager CacheHandlerChainFactory RedisCacheInterceptor \
                     RedisCacheOperationSource RedissonConfiguration; do
            if ! find src/main/java -name "${cls}.java" | grep -q .; then
              echo "::error::Key class '$cls' referenced in docs not found in src/main/java"
              exit 1
            fi
          done
          echo "OK: All key classes referenced in docs exist in src."

  dependency-audit:
    name: "1.3 Security · Dependency Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: ./.github/actions/setup-jdk-21

      - name: Analyze Dependencies
        run: ./mvnw dependency:analyze -B
        continue-on-error: true

      - name: Check Dependency Updates
        run: ./mvnw versions:display-dependency-updates -B
        continue-on-error: true

  # =========================================================================
  # Stage 2: Core Test & Coverage Matrix
  # =========================================================================
  core-verify:
    name: "2.1 Test · Core & Testcontainers IT"
    runs-on: ubuntu-latest
    needs: [checkstyle, docs-consistency]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: ./.github/actions/setup-jdk-21

      - name: Verify Core (Unit Tests, Testcontainers IT, JaCoCo Gate)
        run: ./mvnw clean verify -B

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

  # =========================================================================
  # Stage 3: Module Packaging & Benchmark Verification (Parallel)
  # =========================================================================
  bench-module:
    name: "3.1 Module · resicache-bench JMH"
    runs-on: ubuntu-latest
    needs: [core-verify]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: ./.github/actions/setup-jdk-21

      - name: Install ResiCache Core into local repo
        run: ./mvnw install -DskipTests -B

      - name: Build resicache-bench Fat-JAR
        run: mvn -f resicache-bench/pom.xml clean package -DskipTests -B

      - name: Upload Benchmark JAR
        uses: actions/upload-artifact@v5
        with:
          name: resicache-bench-fatjar
          path: resicache-bench/target/resicache-bench-*.jar
          retention-days: 7

  package-artifact:
    name: "3.2 Package · ResiCache JAR"
    runs-on: ubuntu-latest
    needs: [core-verify]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: ./.github/actions/setup-jdk-21

      - name: Package JAR
        run: ./mvnw clean package -DskipTests -B

      - name: Upload ResiCache Artifact
        uses: actions/upload-artifact@v5
        with:
          name: resicache-core-jar
          path: target/ResiCache-*.jar
          retention-days: 7

  # =========================================================================
  # Stage 4: CI Pipeline Gate (Canonical Branch Protection Anchor)
  # =========================================================================
  ci-gate:
    name: "4.1 Gate · All Checks Passed"
    runs-on: ubuntu-latest
    needs: [checkstyle, docs-consistency, dependency-audit, core-verify, bench-module, package-artifact]
    if: always()

    steps:
      - name: Evaluate Pipeline Status
        run: |
          echo "Evaluating CI Pipeline Stage Results..."
          echo "Checkstyle: ${{ needs.checkstyle.result }}"
          echo "Docs Consistency: ${{ needs.docs-consistency.result }}"
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "Core Verify: ${{ needs.core-verify.result }}"
          echo "Bench Module: ${{ needs.bench-module.result }}"
          echo "Package Artifact: ${{ needs.package-artifact.result }}"

          if [[ "${{ needs.checkstyle.result }}" != "success" ]] || \
             [[ "${{ needs.docs-consistency.result }}" != "success" ]] || \
             [[ "${{ needs.core-verify.result }}" != "success" ]] || \
             [[ "${{ needs.bench-module.result }}" != "success" ]] || \
             [[ "${{ needs.package-artifact.result }}" != "success" ]]; then
            echo "❌ Pipeline failed! One or more required gating jobs did not pass."
            exit 1
          fi

          echo "✅ All required CI pipeline gates passed successfully!"
