name: CI Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verification
    uses: ./.github/workflows/_verify.yml
    with:
      allow-docs-only: false
  ci-ok:
    name: ci-ok
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED_JOBS: verify
        run: bash scripts/ci/require-all-green.sh
