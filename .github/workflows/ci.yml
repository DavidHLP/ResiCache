name: CI Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verification
    uses: ./.github/workflows/_verify.yml
    with:
      allow-docs-only: false
  ci-ok:
    name: ci-ok
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED_JOBS: verify
        run: bash scripts/ci/require-all-green.sh
