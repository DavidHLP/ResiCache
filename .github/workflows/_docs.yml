name: "Reusable · Docs"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-consistency:
    name: Docs ↔ Source Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate contract documentation
        run: bash ./scripts/ci/check-docs-contracts.sh
