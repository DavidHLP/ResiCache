name: "Reusable · Docs"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-consistency:
    name: Docs ↔ Source Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate contract documentation
        run: bash ./scripts/ci/check-docs-contracts.sh
