name: Release Pipeline
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      candidate-run-id:
        description: Original tag run containing the verified candidate and publication record
        type: string
        required: true
      deployment-id:
        description: Saved Central deployment ID; recovery never uploads again
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ inputs.candidate-run-id }}
          DEPLOYMENT_ID: ${{ inputs.deployment-id }}
        run: |
          [[ "$REF_TYPE" == tag ]] || { echo 'Run release recovery on the original tag ref' >&2; exit 1; }
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$RUN_ID" =~ ^[0-9]+$ && "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
            version=$(python3 scripts/ci/pipeline.py preflight "$TAG" --recovery)
          else
            version=$(python3 scripts/ci/pipeline.py preflight "$TAG")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  verify:
    name: Verification
    needs: preflight
    if: github.event_name == 'push'
    uses: ./.github/workflows/_verify.yml
  publish:
    needs: [preflight, verify]
    if: >-
      always() && needs.preflight.result == 'success' &&
      (needs.verify.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-candidate
          path: candidate
          run-id: ${{ inputs.candidate-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate identity
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/ci/pipeline.py verify-candidate candidate --sha "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - name: Download original publication for recovery
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-publication
          path: publication
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - name: Verify original run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/ci/check-recovery.py
      - name: Sign exact verified bytes and create Central bundle
        if: github.event_name == 'push'
        run: python3 scripts/ci/central.py bundle
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
      - name: Upload once
        if: github.event_name == 'push'
        run: python3 scripts/ci/central.py upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      - name: Confirm Central publication
        env:
          EVENT: ${{ github.event_name }}
          DEPLOYMENT_ID: ${{ inputs.deployment-id }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            python3 scripts/ci/central.py recover --deployment-id "$DEPLOYMENT_ID"
          else
            python3 scripts/ci/central.py poll
          fi
          python3 scripts/ci/central.py verify-published
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('publication')
          files = sorted(p for p in root.iterdir() if p.name != 'SHA256SUMS')
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PY
      - name: Save publication record even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-publication
          path: publication/
          retention-days: 90
  github-release:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-publication
          path: publication
      - name: Create or finish GitHub Release after PUBLISHED
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads(Path('publication/central-status.json').read_text())
          manifest = json.loads(Path('publication/manifest.json').read_text())
          assert status['deploymentState'] == 'PUBLISHED'
          assert manifest['sha'] == os.environ['GITHUB_SHA']
          assert manifest['version'] == os.environ['RELEASE_VERSION']
          changelog = Path('CHANGELOG.md').read_text()
          notes = changelog.split('## [' + manifest['version'] + ']', 1)[1].split('\n## [', 1)[0]
          Path('release-notes.md').write_text('Version: ' + manifest['version'] + '\nCommit: ' + manifest['sha'] + '\nCentral deployment: ' + status['deploymentId'] + '\n\n' + notes)
          PY
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" publication/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" publication/* --verify-tag \
              --title "ResiCache $RELEASE_VERSION" --notes-file release-notes.md \
              "${prerelease[@]}" --repo "$GITHUB_REPOSITORY"
          fi
