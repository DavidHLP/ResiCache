name: Reusable Build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build-test:
    name: Build and Verify (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-jdk-21
      - name: Require working Docker
        run: docker info
      - run: bash scripts/ci/check-test-names.sh
      - name: Full tests, Javadoc and coverage
        run: ./mvnw clean verify -Dtestcontainers.ryuk.disabled=false -B
        env:
          MAVEN_OPTS: '-Xmx1024m -XX:+UseParallelGC'
      - run: python3 scripts/ci/pipeline.py reports
      - run: python3 scripts/ci/pipeline.py candidate target/ci-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-candidate
          path: target/ci-candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: full-test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14
