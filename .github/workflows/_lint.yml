name: "Reusable · Lint"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 21
        uses: ./.github/actions/setup-jdk-21

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check -B
