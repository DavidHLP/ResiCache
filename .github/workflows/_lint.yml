name: "Reusable · Lint"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: ./.github/actions/setup-jdk-21

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check -B
