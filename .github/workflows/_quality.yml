name: "Reusable · Quality"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Dependency scans and Qodana are advisory until their result aggregation is
  # wired into the canonical blocking gate. They never represent release
  # compatibility or contract closure.
  dependency-analysis:
    name: "Advisory · Dependency Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: ./.github/actions/setup-jdk-21

      - name: Analyze Dependencies
        run: ./mvnw dependency:analyze -B
        continue-on-error: true

      - name: Check Dependency Updates
        run: ./mvnw versions:display-dependency-updates -B
        continue-on-error: true

  qodana:
    name: "Advisory · Qodana Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.3
        # Qodana requires a license token; PRs from forks and repos without the
        # secret configured cannot run a real scan. Skip cleanly instead of
        # failing the step (which would surface an error annotation on every run).
        if: ${{ secrets.QODANA_TOKEN != '' }}
        with:
          cache-dir: .qodana/cache
          use-caches: true
          results-dir: ./qodana/report
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Upload Qodana Report
        if: ${{ always() && secrets.QODANA_TOKEN != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: qodana-report
          path: ./qodana/report/
          retention-days: 7
