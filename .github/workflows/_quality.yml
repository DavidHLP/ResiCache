name: "Reusable · Quality"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: ./.github/actions/setup-jdk-21

      - name: Analyze Dependencies
        run: ./mvnw dependency:analyze -B
        continue-on-error: true

      - name: Check Dependency Updates
        run: ./mvnw versions:display-dependency-updates -B
        continue-on-error: true

  qodana:
    name: Qodana Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.3
        with:
          cache-dir: .qodana/cache
          use-caches: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        continue-on-error: true

      - name: Upload Qodana Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qodana-report
          path: ./qodana/report/
          retention-days: 7
