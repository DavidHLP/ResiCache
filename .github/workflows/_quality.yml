name: "Reusable · Quality"

on:
  workflow_call:
    inputs:
      qodana-enabled:
        description: >-
          Opt-in flag for the Qodana scan. Set to 'true' (repo/org variable
          QODANA_ENABLED, or explicit caller input) only when a valid
          QODANA_TOKEN secret is configured; otherwise the scan is skipped so
          an absent/declined token cannot produce error annotations.
        required: false
        type: boolean
        default: false
    secrets:
      QODANA_TOKEN:
        description: "Qodana license token (only used when qodana-enabled is true)"
        required: false

permissions:
  contents: read

jobs:
  # Dependency scans and Qodana are advisory until their result aggregation is
  # wired into the canonical blocking gate. They never represent release
  # compatibility or contract closure.
  dependency-analysis:
    name: "Advisory · Dependency Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: ./.github/actions/setup-jdk-21

      - name: Analyze Dependencies
        run: ./mvnw dependency:analyze -B
        continue-on-error: true

      - name: Check Dependency Updates
        run: ./mvnw versions:display-dependency-updates -B
        continue-on-error: true

  qodana:
    name: "Advisory · Qodana Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Qodana requires a valid license token. Scans run only when the caller
      # opts in via the qodana-enabled input AND the token is present; a
      # missing/declined token then skips cleanly instead of failing the step.
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Qodana Scan
        if: ${{ inputs.qodana-enabled && env.QODANA_TOKEN != '' }}
        uses: JetBrains/qodana-action@v2025.3
        with:
          cache-dir: .qodana/cache
          use-caches: true
          results-dir: ./qodana/report
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Upload Qodana Report
        if: ${{ always() && inputs.qodana-enabled && env.QODANA_TOKEN != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: qodana-report
          path: ./qodana/report/
          retention-days: 7
