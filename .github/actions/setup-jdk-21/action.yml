name: 'Setup JDK 21 (ResiCache)'

description: >-
  Composite action that sets up JDK + Maven cache for ResiCache
  CI. Java version defaults to '21' to match pom.xml
  <java.version>21</java.version> (WS-1.1 FIRE commit 38c514a).
  CI and PR workflows that need a JDK should call this
  composite instead of inlining `setup-java@v5` — single source
  of truth for JDK version + distribution + cache config in those workflows.

  Note: This composite intentionally does NOT forward Maven
  Central / GPG deploy inputs. `actions/setup-java@v5`
  unconditionally writes a `<server>` block to `~/.m2/settings.xml`
  even when `server-id` is an empty string, which produces
  `<server><id></id>…</server>` and causes Maven 3.9+ to abort
  with `servers.server[0].id is missing`. CI and PR-check jobs
  must not inherit that block. The release workflow calls
  `actions/setup-java@v5` directly with deploy inputs.

inputs:
  java-version:
    description: 'JDK version (must match pom.xml <java.version>)'
    required: false
    default: '21'
  distribution:
    description: 'JDK distribution'
    required: false
    default: 'temurin'
  cache:
    description: 'Actions dependency cache (maven, gradle, or empty)'
    required: false
    default: 'maven'

runs:
  using: composite
  steps:
    - name: Setup JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: ${{ inputs.cache }}
