version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: maven
    directories:
      - /
      - /resicache-bench
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: org.springframework.boot:*
        update-types: [version-update:semver-major]
